services:
  - type: web
    name: daily-compass-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: daily-compass-accounts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DAILY_COMPASS_DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        value: capacitor://localhost,https://localhost
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_COMPASS_MODERATOR_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DAILY_COMPASS_ANNOUNCEMENT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_SUBSCRIPTION_ID
        value: compass_plus
      - key: GOOGLE_PLAY_BASE_PLAN_ID
        value: monthly
