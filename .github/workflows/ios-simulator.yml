name: iOS simulator build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Prepare app
        run: |
          npm install --global pnpm@10.20.0
          pnpm install --frozen-lockfile
          npm run ios
          npm run ios:check
      - name: Prepare empty screenshot account
        run: node scripts/ios-capture-account.mjs
      - name: Capture genuine iPhone and iPad screens
        run: bash scripts/capture-ios-store.sh
      - name: Save native store screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: daily-compass-store-screenshots
          path: work/store-screenshots/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove empty screenshot account
        if: always()
        run: node scripts/ios-capture-account.mjs --cleanup
      - name: Save capture diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: daily-compass-capture-logs
          path: work/*capture*.log
          retention-days: 1
          if-no-files-found: ignore